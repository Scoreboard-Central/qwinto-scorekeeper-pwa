<div class="w-full h-full flex flex-col p-3 text-black dark:text-white select-none">
  <div class="flex justify-center text-lg md:text-2xl my-2 font-bold">Select Score</div>
  <div class="flex flex-row flex-wrap justify-center items-center gap-2 my-2 flex-1">
    <ng-container *ngFor="let number of filteredScores">
      <div (click)="closeModal(number)"
        [class]="fillClass + ' ' + textClass + ' w-11 h-11 rounded-full border-2 flex items-center justify-center font-bold text-lg border-black cursor-pointer transition-transform hover:scale-105 active:scale-95'">
        {{ number }}
      </div>
    </ng-container>
  </div>
  <div class="flex w-full justify-center gap-4 mt-2 border-t border-gray-200 dark:border-gray-700 pt-2">
    <button (click)="closeModal(0)"
      class="h-9 w-24 rounded-md bg-gray-700 hover:bg-gray-600 text-white text-sm font-semibold cursor-pointer transition-colors">
      Clear
    </button>
    <button (click)="closeModal(null)"
      class="h-9 w-24 rounded-md bg-gray-700 hover:bg-gray-600 text-white text-sm font-semibold cursor-pointer transition-colors">
      Cancel
    </button>
  </div>
</div>
