<div class="settings-modal-container text-black dark:text-white">
  <!-- Header -->
  <div class="tabs-header">
    <div class="tabs-list">
      <div class="tab-button" [class.active]="selectedTab === 0" (click)="selectedTab = 0">Settings</div>
      <div class="tab-button" [class.active]="selectedTab === 1" (click)="selectHistory()">History</div>
    </div>
    <div class="close-button" (click)="closeSettings()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </div>
  </div>

  <!-- Body -->
  <div class="settings-body">
    <!-- Settings Tab -->
    <div *ngIf="selectedTab === 0" class="flex flex-col gap-2">
      <div class="setting-row">
        <span class="setting-label">Row 1 Color</span>
        <div class="setting-control">
          <select [(ngModel)]="selectedColor0" class="premium-select" (change)="colorSelected($event, 0)">
            <option value="bg-red-500">Red</option>
            <option value="bg-yellow-400">Yellow</option>
            <option value="bg-green-500">Green</option>
            <option value="bg-blue-500">Blue</option>
            <option value="bg-orange-500">Orange</option>
            <option value="bg-purple-500">Purple</option>
          </select>
          <div class="color-preview" [ngClass]="selectedColor0"></div>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Row 2 Color</span>
        <div class="setting-control">
          <select [(ngModel)]="selectedColor1" class="premium-select" (change)="colorSelected($event, 1)">
            <option value="bg-red-500">Red</option>
            <option value="bg-yellow-400">Yellow</option>
            <option value="bg-green-500">Green</option>
            <option value="bg-blue-500">Blue</option>
            <option value="bg-orange-500">Orange</option>
            <option value="bg-purple-500">Purple</option>
          </select>
          <div class="color-preview" [ngClass]="selectedColor1"></div>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Row 3 Color</span>
        <div class="setting-control">
          <select [(ngModel)]="selectedColor2" class="premium-select" (change)="colorSelected($event, 2)">
            <option value="bg-red-500">Red</option>
            <option value="bg-yellow-400">Yellow</option>
            <option value="bg-green-500">Green</option>
            <option value="bg-blue-500">Blue</option>
            <option value="bg-orange-500">Orange</option>
            <option value="bg-purple-500">Purple</option>
          </select>
          <div class="color-preview" [ngClass]="selectedColor2"></div>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Theme</span>
        <div class="setting-control">
          <select [(ngModel)]="selectedTheme" class="premium-select" (change)="themeSelected()">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Enable Dice</span>
        <div class="setting-control">
          <div class="premium-toggle" [class.active]="enableDice" (click)="enableDice = !enableDice; diceToggled()">
            <div class="toggle-handle"></div>
          </div>
        </div>
      </div>

      <div class="flex justify-center mt-6">
        <button class="premium-button" (click)="resetColors()">Reset Colors</button>
      </div>
    </div>

    <!-- History Tab -->
    <div *ngIf="selectedTab === 1" class="flex flex-col h-full animate-fadeIn">
      <input class="hidden" type="file" id="upload-file" accept=".json" (change)="addAttachment($event)" />
      
      <div *ngIf="gameHistory().length; else noGames" class="flex flex-col h-full">
        <!-- Stats -->
        <div class="history-stats">
          <div class="stat-card">
            <span class="stat-label">High Score</span>
            <span class="stat-value text-emerald-500">{{ highScore() }}</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Low Score</span>
            <span class="stat-value text-red-500">{{ lowScore() }}</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Average</span>
            <span class="stat-value text-blue-500">{{ avgScore() | number : '1.1-1' }}</span>
          </div>
        </div>

        <!-- Table -->
        <div class="history-table-container">
          <table class="premium-table">
            <thead>
              <tr>
                <th class="delete-cell"></th>
                <th>Date</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let game of gameHistory(); let i = index">
                <td class="delete-cell" (click)="deleteHistoryEntry(i)">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 inline">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </td>
                <td>{{ game.date | date }}</td>
                <td class="font-bold">{{ game.score }}</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Footer -->
        <div class="history-footer">
          <button class="premium-button" (click)="downloadHistory()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
            </svg>
            Export JSON
          </button>
          <button class="premium-button" (click)="openFileExplorer()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
            </svg>
            Import JSON
          </button>
        </div>
      </div>

      <ng-template #noGames>
        <div class="w-full flex justify-center flex-col items-center py-8 gap-4">
          <h2 class="text-xl font-bold opacity-60">No Game History</h2>
          <button class="premium-button primary" (click)="openFileExplorer()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
            </svg>
            Import History JSON
          </button>
        </div>
      </ng-template>
    </div>
  </div>
</div>
