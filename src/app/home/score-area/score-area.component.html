<div class="score-shape border-2 cursor-pointer" [ngClass]="[
    !isPentagon ? 'rounded-full' : '',
    isPentagon ? 'rounded-md' : '',
    isBlank ? 'border-none !bg-transparent' : 'border-black border-2 text-black font-bold text-xl sm:text-2xl md:text-3xl lg:text-4xl',
    colors?.background || '',
    colors?.text || ''
  ]" (click)="presentModal()">
  <span class="score-shape-inner">
    <span *ngIf="isBlank"></span>
    <span *ngIf="isPentagon">{{ selectedScore && selectedScore > 0 ? selectedScore : '' }}</span>
    <span *ngIf="!isBlank && !isPentagon">{{ selectedScore && selectedScore > 0 ? selectedScore : '' }}</span>
  </span>
</div>
