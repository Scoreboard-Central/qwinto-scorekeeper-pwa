<div class="reset-modal-container text-black dark:text-white">
  <!-- Header -->
  <div class="modal-header">
    <h2 class="modal-title">Reset Game</h2>
    <div class="close-button" (click)="respond(false)">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </div>
  </div>

  <!-- Body Content -->
  <div class="modal-body">
    <p class="modal-message">Are you sure you want to reset the current game?</p>
    
    <div class="setting-row">
      <span class="setting-label">Include this game in history</span>
      <div class="setting-control">
        <div class="premium-toggle" [class.active]="includeInHistory" (click)="includeInHistory = !includeInHistory">
          <div class="toggle-handle"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="modal-footer">
    <button class="premium-button" (click)="respond(false)">Cancel</button>
    <button class="premium-button primary" (click)="respond(true)">Reset</button>
  </div>
</div>
